name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show original files
        run: |
          echo "Original repo structure:"
          ls -la

      - name: Repair Vite React source structure
        run: |
          echo "Creating src folder structure..."
          mkdir -p src
          mkdir -p src/components
          mkdir -p src/store

          echo "Moving source files into correct folders..."

          # Move store-related files to src/store/
          for file in useStore.ts database.ts helpers.ts cn.ts
          do
            if [ -f "$file" ]; then
              echo "Moving $file to src/store/$file"
              mv "$file" "src/store/$file"
            fi
          done

          # Move component files to src/components/
          for file in \
            Sidebar.tsx \
            TopBar.tsx \
            JobDetailModal.tsx \
            JobFormModal.tsx
          do
            if [ -f "$file" ]; then
              echo "Moving $file to src/components/$file"
              mv "$file" "src/components/$file"
            fi
          done

          # Move page files to src/
          for file in \
            App.tsx \
            main.tsx \
            index.css \
            AnalyticsPage.tsx \
            AuthPage.tsx \
            CalendarPage.tsx \
            DashboardPage.tsx \
            JobsPage.tsx \
            MainLayout.tsx \
            SettingsPage.tsx
          do
            if [ -f "$file" ]; then
              echo "Moving $file to src/$file"
              mv "$file" "src/$file"
            fi
          done

          echo "Ensuring vite-env file exists..."
          if [ ! -f src/vite-env.d.ts ]; then
            echo '/// <reference types="vite/client" />' > src/vite-env.d.ts
          fi

          echo "Ensuring index.html points to /src/main.tsx..."
          if [ -f index.html ]; then
            sed -i 's|src="/main.tsx"|src="/src/main.tsx"|g' index.html
            sed -i 's|src="./main.tsx"|src="/src/main.tsx"|g' index.html
            sed -i 's|src="main.tsx"|src="/src/main.tsx"|g' index.html
          fi

          echo "Final repaired structure:"
          find . -maxdepth 3 -type f | sort

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Ensure Capacitor Android dependencies exist
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            echo "No android folder found. Creating Capacitor Android project..."
            npx cap add android
          else
            echo "Android folder already exists."
          fi

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android

      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobTrackr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
