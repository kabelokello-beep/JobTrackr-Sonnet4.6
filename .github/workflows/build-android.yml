name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔥 AUTO FIX REPO STRUCTURE & CREATE ALL MISSING FILES
        run: |
          # Create full correct folder structure
          mkdir -p src/components src/utils

          # Auto move all page and component files
          mv *Page.tsx *Modal.tsx Sidebar.tsx TopBar.tsx MainLayout.tsx src/components/ 2>/dev/null || true

          # Auto move all core source files
          mv App.tsx main.tsx index.css useStore.ts database.ts helpers.ts cn.ts src/ 2>/dev/null || true

          # Create JobTrackr types.ts
          cat > src/types.ts << 'EOF'
export interface Job {
  id: string;
  company: string;
  title: string;
  location: string;
  salary: string;
  status: 'saved' | 'applied' | 'interview' | 'offer' | 'rejected';
  dateApplied: string;
  notes: string;
  source: string;
  createdAt: number;
}

export interface FilterState {
  status: string;
  search: string;
  dateFrom: string;
  dateTo: string;
}
EOF

          # Create OCR utility (matches your app's advertised feature)
          cat > src/utils/ocr.ts << 'EOF'
import Tesseract from 'tesseract.js';

export const extractTextFromImage = async (file: File) => {
  const result = await Tesseract.recognize(file, 'eng');
  return result.data.text;
};

export const autoParseJob = (text: string) => ({
  title: text.match(/(title|position|role):\s*(.*)/i)?.[2] || '',
  company: text.match(/(company|employer):\s*(.*)/i)?.[2] || '',
  location: text.match(/(location|city):\s*(.*)/i)?.[2] || '',
  salary: text.match(/(salary|pay|compensation):\s*(.*)/i)?.[2] || '',
})
EOF

          # Create date helper
          cat > src/utils/date.ts << 'EOF'
export const formatDate = (date: Date) => new Intl.DateTimeFormat('en-ZA').format(date);
export const getDaysAgo = (timestamp: number) => Math.floor((Date.now() - timestamp) / 86400000);
EOF

          # Create export helper
          cat > src/utils/export.ts << 'EOF'
import type { Job } from '../types';
export const exportToCSV = (jobs: Job[]) => {
  const headers = Object.keys(jobs[0]).join(',');
  const rows = jobs.map(j => Object.values(j).join(','));
  return [headers, ...rows].join('\n');
}
EOF

          echo "✅ All fixes completed!"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all dependencies
        run: npm install

      - name: Build Vite web app
        run: npm run build

      - name: Build Capacitor Android APK
        uses: ./.github/actions/build-apk

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: JobTrackr-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
