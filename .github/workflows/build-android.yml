name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair Vite React source structure
        run: |
          echo "Creating src folder structure..."
          mkdir -p src
          mkdir -p src/components
          mkdir -p src/store
          mkdir -p src/pages
          mkdir -p src/layouts
          mkdir -p src/db
          mkdir -p src/utils

          for file in useStore.ts
          do
            if [ -f "$file" ]; then mv "$file" "src/store/$file"; fi
          done

          for file in database.ts
          do
            if [ -f "$file" ]; then mv "$file" "src/db/$file"; fi
          done

          for file in helpers.ts cn.ts notifications.ts
          do
            if [ -f "$file" ]; then mv "$file" "src/utils/$file"; fi
          done

          for file in Sidebar.tsx TopBar.tsx JobDetailModal.tsx JobFormModal.tsx
          do
            if [ -f "$file" ]; then mv "$file" "src/components/$file"; fi
          done

          for file in AnalyticsPage.tsx AuthPage.tsx CalendarPage.tsx DashboardPage.tsx JobsPage.tsx SettingsPage.tsx
          do
            if [ -f "$file" ]; then mv "$file" "src/pages/$file"; fi
          done

          for file in MainLayout.tsx
          do
            if [ -f "$file" ]; then mv "$file" "src/layouts/$file"; fi
          done

          for file in App.tsx main.tsx index.css
          do
            if [ -f "$file" ]; then mv "$file" "src/$file"; fi
          done

          echo '/// <reference types="vite/client" />' > src/vite-env.d.ts

          if [ -f index.html ]; then
            sed -i 's|src="/main.tsx"|src="/src/main.tsx"|g' index.html
            sed -i 's|src="./main.tsx"|src="/src/main.tsx"|g' index.html
            sed -i 's|src="main.tsx"|src="/src/main.tsx"|g' index.html
          fi

          echo "Final repaired structure:"
          find . -maxdepth 4 -type f | sort

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Capacitor Android dependencies exist
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/local-notifications --legacy-peer-deps --no-audit --no-fund
          npm install react-is --legacy-peer-deps --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android folder already exists."
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate app icon
        run: |
          if [ -f icon.svg ]; then
            sudo apt-get install -y librsvg2-bin
            rsvg-convert -w 1024 -h 1024 icon.svg -o icon_1024.png
            mkdir -p assets
            cp icon_1024.png assets/icon.png
            npm install @capacitor/assets --no-save --legacy-peer-deps
            npx @capacitor/assets generate --android
            echo "Icon generated successfully"
          else
            echo "No icon.svg found, skipping icon generation"
          fi

      - name: Fix Kotlin stdlib duplicate classes
        run: |
          cat >> android/build.gradle << 'EOF'

          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobTrackr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
